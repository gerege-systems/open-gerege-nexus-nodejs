name: Deploy to Production (js.nexus.gerege.mn)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (defaults to this commit)"
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: js-production-deploy
  cancel-in-progress: false

env:
  PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN || 'https://js.nexus.gerege.mn' }}
  DEMO_MODE: ${{ vars.DEMO_MODE || 'false' }}

jobs:
  build-and-push:
    name: Build & push ${{ matrix.component }} image
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      matrix:
        include:
          - component: backend
            context: .
            dockerfile: deploy/Dockerfile
          - component: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${REPO_LOWER}-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ inputs.tag || github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.PUBLIC_ORIGIN }}/api/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server (js.nexus.gerege.mn)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy stack via SSH
        env:
          HOST: ${{ vars.DEPLOY_HOST || 'js.nexus.gerege.mn' }}
          USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          PORT: ${{ vars.DEPLOY_PORT || '22' }}
          TAG: ${{ inputs.tag || github.event.workflow_run.head_sha || github.sha }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -o StrictHostKeyChecking=no -p "$PORT" "$USER@$HOST" "mkdir -p ~/app-js"
          scp -o StrictHostKeyChecking=no -P "$PORT" docker-compose.prod.yml "$USER@$HOST:~/app-js/docker-compose.yml"
          scp -o StrictHostKeyChecking=no -P "$PORT" deploy/nginx/js.nexus.gerege.mn.conf "$USER@$HOST:~/app-js/js.nexus.gerege.mn.conf"

          printf '%s' "$REGISTRY_TOKEN" | ssh -o StrictHostKeyChecking=no -p "$PORT" "$USER@$HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null"

          ssh -o StrictHostKeyChecking=no -p "$PORT" "$USER@$HOST" "
            cd ~/app-js && \
            export IMAGE_BACKEND=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')-backend && \
            export IMAGE_FRONTEND=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')-frontend && \
            export IMAGE_TAG='$TAG' && \
            export POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}' && \
            export SSO_DEFAULT_CLIENT_SECRET='${{ secrets.SSO_DEFAULT_CLIENT_SECRET }}' && \
            export PUBLIC_ORIGIN='${{ env.PUBLIC_ORIGIN }}' && \
            docker compose pull && \
            docker compose up -d
          "
