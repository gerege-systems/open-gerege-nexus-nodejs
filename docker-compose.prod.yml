# Production stack for Gerege Nexus (Node.js & Express - CJS Edition).
# Dedicated domain: js.nexus.gerege.mn
#
# Container names, database names, volumes, and ports are isolated to run
# side-by-side with nexus.gerege.mn, salus.gerege.mn, and sso.gerege.mn without any collisions.

services:
  postgres:
    image: postgres:16-alpine
    container_name: js_gerege_nexus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-js_platform_db}
      POSTGRES_USER: ${POSTGRES_USER:-js_postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - js_gerege_nexus_platform_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-js_postgres} -d ${POSTGRES_DB:-js_platform_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${IMAGE_BACKEND}:${IMAGE_TAG:-latest}
    container_name: js_gerege_nexus_backend
    restart: unless-stopped
    pull_policy: always
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-js_postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-js_platform_db}?sslmode=disable
      PORT: 8080
      ENVIRONMENT: production
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://js.nexus.gerege.mn}
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-https://js.nexus.gerege.mn}
      TRUST_PROXY_HEADERS: "true"
      SSO_ISSUER: ${PUBLIC_ORIGIN:-https://js.nexus.gerege.mn}
      SSO_DEFAULT_CLIENT_SECRET: ${SSO_DEFAULT_CLIENT_SECRET:-gerege_js_sso_secret_2026}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SEED_DEMO_DATA: ${DEMO_MODE:-false}
      EID_MOCK_MODE: ${EID_MOCK_MODE:-false}
      EID_BASE_URL: ${EID_BASE_URL:-https://eidmongolia.mn/v3}
      EID_RP_UUID: ${EID_RP_UUID:-}
      EID_RP_SECRET: ${EID_RP_SECRET:-}
      EID_RP_NAME: ${EID_RP_NAME:-Gerege Nexus Node.js}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
    ports:
      - "127.0.0.1:8084:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080/health').then(r => r.ok ? process.exit(0) : process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: ${IMAGE_FRONTEND}:${IMAGE_TAG:-latest}
    container_name: js_gerege_nexus_frontend
    restart: unless-stopped
    pull_policy: always
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  js_gerege_nexus_platform_postgres_data:
    name: js_gerege_nexus_platform_postgres_data
